<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Pentago Web</title>
  <link rel="stylesheet" href="/css/main.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>🎮 Pentago Web</h1>
      <a href="/pages/index.html" class="btn-back">← Voltar</a>
    </header>

    <main>
      <div class="form-container">
        <h2>Entrar</h2>

        <div id="message" style="display: none; margin-bottom: 1rem; padding: 0.75rem; border-radius: 4px;"></div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-group">
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>
          </div>

          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>

        <p class="form-footer">
          Não tem conta? <a href="/pages/register.html">Cadastre-se</a>
        </p>
      </div>
    </main>
  </div>

  <script src="/js/utils/api.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    // Custom validation messages in Portuguese
    emailInput.addEventListener('invalid', function(e) {
      e.preventDefault();
      if (this.validity.valueMissing) {
        this.setCustomValidity('Por favor, preencha seu email.');
      } else if (this.validity.typeMismatch) {
        this.setCustomValidity('Por favor, insira um email válido.');
      }
    });

    emailInput.addEventListener('input', function() {
      this.setCustomValidity('');
    });

    passwordInput.addEventListener('invalid', function(e) {
      e.preventDefault();
      if (this.validity.valueMissing) {
        this.setCustomValidity('Por favor, preencha sua senha.');
      }
    });

    passwordInput.addEventListener('input', function() {
      this.setCustomValidity('');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Clear previous messages
      UIUtils.clearMessages('message');

      const credentials = {
        email: emailInput.value.trim(),
        password: passwordInput.value
      };

      // Disable submit button
      const submitBtn = form.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Entrando...';

      try {
        const response = await AuthAPI.login(credentials);

        if (response.success) {
          UIUtils.showSuccess('Login realizado com sucesso! Redirecionando...', 'message');

          // Redirect to main page after 1 second
          setTimeout(() => {
            window.location.href = '/pages/index.html';
          }, 1000);
        }
      } catch (error) {
        console.error('Erro no login:', error);
        UIUtils.showError(error.message || 'Erro ao fazer login. Por favor, tente novamente.', 'message');
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });
  </script>
</body>

</html>
