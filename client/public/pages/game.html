<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo - Pentago Web</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/game.css">
</head>

<body>
  <div class="game-layout">
    <!-- Sidebar esquerda - Informações e Chat -->
    <aside class="sidebar sidebar-left">
      <!-- Informações dos jogadores -->
      <div class="card players-card">
        <div class="card-header">
          <h3 class="card-title">Jogadores</h3>
        </div>
        <div class="card-body">
          <div class="player-info player-1-info">
            <div class="player-avatar">
              <img id="player1Avatar" src="/assets/img/avatars/default.png" alt="Jogador 1">
            </div>
            <div class="player-details">
              <h4 id="player1Name">Jogador 1</h4>
              <div class="player-stats">
                <span class="player-score">Pontos: <strong id="player1Score">0</strong></span>
              </div>
            </div>
            <div class="player-status" id="player1Status">
              <span class="status-indicator"></span>
            </div>
          </div>

          <div class="vs-divider">VS</div>

          <div class="player-info player-2-info">
            <div class="player-avatar">
              <img id="player2Avatar" src="/assets/img/avatars/default.png" alt="Jogador 2">
            </div>
            <div class="player-details">
              <h4 id="player2Name">Jogador 2</h4>
              <div class="player-stats">
                <span class="player-score">Pontos: <strong id="player2Score">0</strong></span>
              </div>
            </div>
            <div class="player-status" id="player2Status">
              <span class="status-indicator"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Chat (preparado para futuro) -->
      <div class="card chat-card" style="display: none;">
        <div class="card-header">
          <h3 class="card-title">Chat</h3>
          <div class="chat-header-actions">
            <div class="chat-toggle-buttons">
              <button class="chat-toggle-btn active" data-channel="game">Jogo</button>
              <button class="chat-toggle-btn" data-channel="lobby">Lobby</button>
            </div>
            <button id="openVideoChat" class="btn btn-secondary btn-video-chat" title="Abrir vídeo chat">
              📹
            </button>
          </div>
        </div>
        <div class="card-body">
          <div class="chat-messages" id="chatMessages">
            <!-- Mensagens do chat aparecerão aqui -->
          </div>
          <div class="chat-input-container">
            <input type="text" id="chatInput" placeholder="Digite sua mensagem..." disabled>
            <button id="chatSend" class="btn btn-primary" disabled>✉️</button>
          </div>
        </div>
      </div>

      <!-- Vídeo Chat -->
      <div class="card video-chat-card" id="videoChatCard" style="display: none;">
        <div class="card-header">
          <h3 class="card-title">Vídeo Chat</h3>
          <div class="video-controls">
            <button id="toggleVideo" class="video-control-btn" title="Ativar/Desativar câmera">
              📹
            </button>
            <button id="toggleAudio" class="video-control-btn" title="Ativar/Desativar áudio">
              🎤
            </button>
            <button id="toggleVideoChat" class="video-control-btn toggle-video-chat" title="Fechar vídeo chat">
              ✕
            </button>
          </div>
        </div>
        <div class="card-body video-chat-body">
          <div class="video-container">
            <!-- Vídeo do oponente (principal) -->
            <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
            <!-- Vídeo próprio (miniatura) -->
            <video id="localVideo" class="local-video" autoplay muted playsinline></video>

            <!-- Status de conexão -->
            <div id="videoStatus" class="video-status">
              <span class="status-text">Aguardando conexão...</span>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Área central - Tabuleiro do jogo -->
    <main class="game-main">
      <header class="game-header">
        <div class="game-title">
          <h1>🎮 Pentago</h1>
          <a href="/pages/index.html" class="btn-back-demo">← Sair</a>
        </div>

        <!-- Informações do turno atual -->
        <div class="game-info-bar">
          <div class="current-turn">
            <span>Turno de: </span>
            <span id="currentPlayerDisplay" class="player-badge player-1-badge">Jogador 1</span>
          </div>
          <div class="game-phase-info">
            <span id="gamePhase" class="phase-badge">Coloque uma peça</span>
          </div>
        </div>
      </header>

      <!-- Mensagem de status do jogo -->
      <div id="gameMessage" class="game-message hidden"></div>

      <!-- Notificação de turno -->
      <div id="turnNotification" class="turn-notification hidden"></div>

      <!-- Tabuleiro Pentago -->
      <div class="game-board">
        <div class="quadrant" id="quadrant-0" data-quadrant="0">
          <div class="rotate-buttons">
            <button class="rotate-btn rotate-left" data-quadrant="0" data-direction="left" title="Girar anti-horário">↺</button>
            <button class="rotate-btn rotate-right" data-quadrant="0" data-direction="right" title="Girar horário">↻</button>
          </div>
          <div class="grid">
            <div class="cell" data-quadrant="0" data-cell="0"></div>
            <div class="cell" data-quadrant="0" data-cell="1"></div>
            <div class="cell" data-quadrant="0" data-cell="2"></div>
            <div class="cell" data-quadrant="0" data-cell="3"></div>
            <div class="cell" data-quadrant="0" data-cell="4"></div>
            <div class="cell" data-quadrant="0" data-cell="5"></div>
            <div class="cell" data-quadrant="0" data-cell="6"></div>
            <div class="cell" data-quadrant="0" data-cell="7"></div>
            <div class="cell" data-quadrant="0" data-cell="8"></div>
          </div>
        </div>

        <div class="quadrant" id="quadrant-1" data-quadrant="1">
          <div class="rotate-buttons">
            <button class="rotate-btn rotate-left" data-quadrant="1" data-direction="left" title="Girar anti-horário">↺</button>
            <button class="rotate-btn rotate-right" data-quadrant="1" data-direction="right" title="Girar horário">↻</button>
          </div>
          <div class="grid">
            <div class="cell" data-quadrant="1" data-cell="0"></div>
            <div class="cell" data-quadrant="1" data-cell="1"></div>
            <div class="cell" data-quadrant="1" data-cell="2"></div>
            <div class="cell" data-quadrant="1" data-cell="3"></div>
            <div class="cell" data-quadrant="1" data-cell="4"></div>
            <div class="cell" data-quadrant="1" data-cell="5"></div>
            <div class="cell" data-quadrant="1" data-cell="6"></div>
            <div class="cell" data-quadrant="1" data-cell="7"></div>
            <div class="cell" data-quadrant="1" data-cell="8"></div>
          </div>
        </div>

        <div class="quadrant" id="quadrant-2" data-quadrant="2">
          <div class="rotate-buttons">
            <button class="rotate-btn rotate-left" data-quadrant="2" data-direction="left" title="Girar anti-horário">↺</button>
            <button class="rotate-btn rotate-right" data-quadrant="2" data-direction="right" title="Girar horário">↻</button>
          </div>
          <div class="grid">
            <div class="cell" data-quadrant="2" data-cell="0"></div>
            <div class="cell" data-quadrant="2" data-cell="1"></div>
            <div class="cell" data-quadrant="2" data-cell="2"></div>
            <div class="cell" data-quadrant="2" data-cell="3"></div>
            <div class="cell" data-quadrant="2" data-cell="4"></div>
            <div class="cell" data-quadrant="2" data-cell="5"></div>
            <div class="cell" data-quadrant="2" data-cell="6"></div>
            <div class="cell" data-quadrant="2" data-cell="7"></div>
            <div class="cell" data-quadrant="2" data-cell="8"></div>
          </div>
        </div>

        <div class="quadrant" id="quadrant-3" data-quadrant="3">
          <div class="rotate-buttons">
            <button class="rotate-btn rotate-left" data-quadrant="3" data-direction="left" title="Girar anti-horário">↺</button>
            <button class="rotate-btn rotate-right" data-quadrant="3" data-direction="right" title="Girar horário">↻</button>
          </div>
          <div class="grid">
            <div class="cell" data-quadrant="3" data-cell="0"></div>
            <div class="cell" data-quadrant="3" data-cell="1"></div>
            <div class="cell" data-quadrant="3" data-cell="2"></div>
            <div class="cell" data-quadrant="3" data-cell="3"></div>
            <div class="cell" data-quadrant="3" data-cell="4"></div>
            <div class="cell" data-quadrant="3" data-cell="5"></div>
            <div class="cell" data-quadrant="3" data-cell="6"></div>
            <div class="cell" data-quadrant="3" data-cell="7"></div>
            <div class="cell" data-quadrant="3" data-cell="8"></div>
          </div>
        </div>
      </div>

      <!-- Controles do jogo -->
      <div class="game-controls">
        <button id="resetBtn" class="btn btn-success">🔄 Novo Jogo</button>
      </div>
    </main>

    <!-- Sidebar direita - Fila de jogadores (preparado para futuro) -->
    <aside class="sidebar sidebar-right" style="display: none;">
      <div class="card queue-card">
        <div class="card-header">
          <h3 class="card-title">Fila de Jogadores</h3>
          <span class="queue-count" id="queueCount">0/25</span>
        </div>
        <div class="card-body">
          <div class="queue-list" id="queueList">
            <!-- Lista de jogadores na fila -->
            <p class="queue-empty">Nenhum jogador na fila</p>
          </div>
        </div>
      </div>

      <!-- Placar geral (preparado para futuro) -->
      <div class="card leaderboard-card">
        <div class="card-header">
          <h3 class="card-title">Placar Geral</h3>
        </div>
        <div class="card-body">
          <div id="leaderboardList">
            <!-- Top jogadores -->
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/utils/api.js"></script>
  <script src="/js/utils/webrtc.js"></script>
  <script src="/js/pages/game.js"></script>
</body>

</html>
