<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Pentago Web</title>
  <link rel="stylesheet" href="/css/main.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>🎮 Pentago Web</h1>
      <a href="/pages/index.html" class="btn-back">← Voltar</a>
    </header>

    <main>
      <div class="form-container">
        <h2>Cadastrar</h2>

        <!-- Alert message -->
        <div id="message" class="alert" style="display: none;"></div>

        <form id="registerForm">
          <div class="form-group">
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name" required title="Por favor, preencha seu nome.">
          </div>

          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required title="Por favor, insira um email válido.">
          </div>

          <div class="form-group">
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required minlength="6" title="A senha deve ter no mínimo 6 caracteres.">
          </div>

          <div class="form-group">
            <label for="age">Idade:</label>
            <input type="number" id="age" name="age" required min="13" max="120" title="A idade mínima é 13 anos.">
          </div>

          <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>

        <p class="form-footer">
          Já tem conta? <a href="/pages/login.html">Faça login</a>
        </p>
      </div>
    </main>
  </div>

  <script src="/js/utils/api.js"></script>
  <script src="/js/pages/register.js"></script>
</body>

</html>
