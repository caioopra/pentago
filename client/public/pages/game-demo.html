<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pentago Demo - Jogue contra o Bot</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/game.css">
</head>

<body>
  <div class="game-layout game-demo-layout">
    <!-- Área central - Tabuleiro do jogo -->
    <main class="game-main game-demo-main">
      <!-- Header minimalista -->
      <header class="game-header game-demo-header">
        <div class="demo-top-bar">
          <h1>🎮 Pentago</h1>
          <a href="/pages/index.html" class="btn btn-back-demo">← Voltar</a>
        </div>
      </header>

      <!-- Informações do turno (acima do tabuleiro, mas compacto) -->
      <div class="game-info-compact">
        <span id="currentPlayerDisplay" class="player-badge player-1-badge">Seu turno</span>
        <span id="gamePhase" class="phase-badge">Coloque uma peça</span>
      </div>

      <!-- Mensagem de status do jogo -->
      <div id="gameMessage" class="game-message hidden"></div>

      <!-- Tabuleiro Pentago -->
      <div class="game-board">
        <div class="quadrant" id="quadrant-0" data-quadrant="0">
          <div class="rotate-buttons">
            <button class="rotate-btn rotate-left" data-quadrant="0" data-direction="left" title="Girar anti-horário">↺</button>
            <button class="rotate-btn rotate-right" data-quadrant="0" data-direction="right" title="Girar horário">↻</button>
          </div>
          <div class="grid">
            <div class="cell" data-quadrant="0" data-cell="0"></div>
            <div class="cell" data-quadrant="0" data-cell="1"></div>
            <div class="cell" data-quadrant="0" data-cell="2"></div>
            <div class="cell" data-quadrant="0" data-cell="3"></div>
            <div class="cell" data-quadrant="0" data-cell="4"></div>
            <div class="cell" data-quadrant="0" data-cell="5"></div>
            <div class="cell" data-quadrant="0" data-cell="6"></div>
            <div class="cell" data-quadrant="0" data-cell="7"></div>
            <div class="cell" data-quadrant="0" data-cell="8"></div>
          </div>
        </div>

        <div class="quadrant" id="quadrant-1" data-quadrant="1">
          <div class="rotate-buttons">
            <button class="rotate-btn rotate-left" data-quadrant="1" data-direction="left" title="Girar anti-horário">↺</button>
            <button class="rotate-btn rotate-right" data-quadrant="1" data-direction="right" title="Girar horário">↻</button>
          </div>
          <div class="grid">
            <div class="cell" data-quadrant="1" data-cell="0"></div>
            <div class="cell" data-quadrant="1" data-cell="1"></div>
            <div class="cell" data-quadrant="1" data-cell="2"></div>
            <div class="cell" data-quadrant="1" data-cell="3"></div>
            <div class="cell" data-quadrant="1" data-cell="4"></div>
            <div class="cell" data-quadrant="1" data-cell="5"></div>
            <div class="cell" data-quadrant="1" data-cell="6"></div>
            <div class="cell" data-quadrant="1" data-cell="7"></div>
            <div class="cell" data-quadrant="1" data-cell="8"></div>
          </div>
        </div>

        <div class="quadrant" id="quadrant-2" data-quadrant="2">
          <div class="rotate-buttons">
            <button class="rotate-btn rotate-left" data-quadrant="2" data-direction="left" title="Girar anti-horário">↺</button>
            <button class="rotate-btn rotate-right" data-quadrant="2" data-direction="right" title="Girar horário">↻</button>
          </div>
          <div class="grid">
            <div class="cell" data-quadrant="2" data-cell="0"></div>
            <div class="cell" data-quadrant="2" data-cell="1"></div>
            <div class="cell" data-quadrant="2" data-cell="2"></div>
            <div class="cell" data-quadrant="2" data-cell="3"></div>
            <div class="cell" data-quadrant="2" data-cell="4"></div>
            <div class="cell" data-quadrant="2" data-cell="5"></div>
            <div class="cell" data-quadrant="2" data-cell="6"></div>
            <div class="cell" data-quadrant="2" data-cell="7"></div>
            <div class="cell" data-quadrant="2" data-cell="8"></div>
          </div>
        </div>

        <div class="quadrant" id="quadrant-3" data-quadrant="3">
          <div class="rotate-buttons">
            <button class="rotate-btn rotate-left" data-quadrant="3" data-direction="left" title="Girar anti-horário">↺</button>
            <button class="rotate-btn rotate-right" data-quadrant="3" data-direction="right" title="Girar horário">↻</button>
          </div>
          <div class="grid">
            <div class="cell" data-quadrant="3" data-cell="0"></div>
            <div class="cell" data-quadrant="3" data-cell="1"></div>
            <div class="cell" data-quadrant="3" data-cell="2"></div>
            <div class="cell" data-quadrant="3" data-cell="3"></div>
            <div class="cell" data-quadrant="3" data-cell="4"></div>
            <div class="cell" data-quadrant="3" data-cell="5"></div>
            <div class="cell" data-quadrant="3" data-cell="6"></div>
            <div class="cell" data-quadrant="3" data-cell="7"></div>
            <div class="cell" data-quadrant="3" data-cell="8"></div>
          </div>
        </div>
      </div>

      <!-- Controles e configurações (abaixo do tabuleiro) -->
      <div class="game-bottom-section">
        <!-- Seletor de dificuldade -->
        <div class="difficulty-selector-bottom">
          <label for="difficulty">🤖 Dificuldade:</label>
          <select id="difficulty" class="difficulty-select">
            <option value="easy" selected>Fácil</option>
            <option value="medium">Médio</option>
            <option value="hard">Difícil</option>
          </select>
        </div>

        <!-- Controles do jogo -->
        <div class="game-controls">
          <button id="resetBtn" class="btn btn-success">🔄 Novo Jogo</button>
          <a href="/pages/login.html" class="btn btn-primary">👤 Jogar Online</a>
        </div>

        <!-- Info extra -->
        <div class="game-info-extra">
          <p>💡 <strong>Você:</strong> Jogador 1 (Vermelho) • <strong>Bot:</strong> Jogador 2 (Azul)</p>
          <p>🎯 <strong>Objetivo:</strong> Forme 5 peças em linha para vencer!</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="/js/utils/pentagoBot.js"></script>
  <script src="/js/pages/game-demo.js"></script>
</body>

</html>
